# 推 main 即编译并发布：macOS arm64 的 dmg/zip 传到以 v<package.json version> 命名的 Release。
# 版本号没动就重推 main 时，会覆盖同名 Release 的附件（不会堆出多个 release）——
# 要出新版本，先改 package.json 的 version 再推。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布 Release 需要写权限；GITHUB_TOKEN 是内置的，不用配 Secret
permissions:
  contents: write

# 同一分支的发布串行跑，避免两次 push 同时改同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    # macos-14 是 GitHub 托管的 Apple Silicon（arm64）机器，构建 arm64 产物是原生的
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 读取版本号
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 构建渲染层
        run: npm run build

      - name: 打包 macOS arm64
        # 没配签名证书，关掉 electron-builder 的签名自动发现，免得它去找钥匙串
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: CCProxy v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            output/*.dmg
            output/*.zip
