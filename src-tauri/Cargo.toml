[package]
name = "ccproxy"
version = "0.4.3"
description = "本地 AI agent 协议代理：识别协议、映射模型、替换凭据、转发上游"
authors = ["CCProxy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ccproxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
bytes = "1"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
thiserror = "2"
log = "0.4"
async-stream = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
dirs = "5"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
